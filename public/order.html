<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>สั่งอาหาร</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family:'Segoe UI', sans-serif; background:#f9f9f9; margin:0; padding:16px; padding-bottom:100px; }
  h1 { color:#2d3436; font-size:22px; }
  .table-badge { display:inline-block; background:#0984e3; color:#fff; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:16px; }
  .category { font-weight:700; margin:20px 0 8px; color:#636e72; text-transform:uppercase; font-size:13px; }
  .item { background:#fff; border-radius:10px; padding:12px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .item.out-of-stock { opacity:0.55; background:#f4f4f4; }
  .item-img { width:56px; height:56px; border-radius:8px; object-fit:cover; background:#eee; flex-shrink:0; }
  .item-left { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .item-info h3 { margin:0; font-size:16px; color:#2d3436; }
  .item-info span { color:#e17055; font-weight:600; }
  .out-of-stock-badge {
    display:inline-block; margin-top:4px; font-size:11px; font-weight:700;
    color:#d63031; background:#fdecea; padding:2px 8px; border-radius:999px;
  }
  .qty-control { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .qty-control button { width:30px; height:30px; border:none; border-radius:6px; background:#dfe6e9; font-size:16px; cursor:pointer; }
  .qty-control button:disabled { background:#eee; color:#ccc; cursor:not-allowed; }
  .qty-control span { min-width:20px; text-align:center; }
  .cart-bar { position:fixed; bottom:0; left:0; right:0; background:#2d3436; color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  .cart-bar button { background:#00b894; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:15px; cursor:pointer; }
  .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#00b894; color:#fff; padding:10px 20px; border-radius:8px; display:none; z-index:50; max-width:90%; text-align:center; }
  .toast.error { background:#d63031; }

  /* ==================== ส่วนแสดงรายการอาหารที่ลูกค้าสั่งไปแล้ว ==================== */
  #myOrdersSection { margin-bottom:24px; }
  #myOrdersSection .section-title { font-weight:700; margin-bottom:10px; color:#2d3436; font-size:16px; }
  .my-order-card {
    background:#fff; border-radius:10px; padding:12px 16px; margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.06); border-left:5px solid #dfe6e9;
  }
  .my-order-card.status-pending { border-left-color:#e17055; }
  .my-order-card.status-cooking { border-left-color:#fdcb6e; }
  .my-order-card.status-served { border-left-color:#00b894; }
  .my-order-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .my-order-time { color:#b2bec3; font-size:12px; }
  .status-pill { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .status-pill.status-pending { background:#fdecea; color:#e17055; }
  .status-pill.status-cooking { background:#fff8e6; color:#e0a325; }
  .status-pill.status-served { background:#e9fbf5; color:#00b894; }
  .my-order-items { font-size:14px; color:#2d3436; margin-bottom:4px; }
  .my-order-total { font-size:13px; font-weight:700; color:#636e72; text-align:right; }
</style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <span class="table-badge" id="tableBadge">โต๊ะ -</span>

  <div id="myOrdersSection" style="display:none;">
    <div class="section-title">🧾 รายการที่คุณสั่งไปแล้ว</div>
    <div id="myOrdersList"></div>
  </div>

  <h1>เลือกเมนูอาหาร</h1>
  <div id="menuList"></div>

  <div class="cart-bar">
    <span>รวม: <strong id="cartTotal">0</strong> บาท</span>
    <button id="submitBtn">สั่งอาหาร</button>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const table = params.get('table') || '1';
  document.getElementById('tableBadge').textContent = `โต๊ะ ${table}`;

  let cart = {}; // menuId -> qty
  let menu = [];

  // รูป placeholder เผื่อเมนูยังไม่มีรูปจริง (data URI สีเทาแบบเบา ๆ ไม่ต้องพึ่งไฟล์ภายนอก)
  const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="56" height="56" fill="#eee"/><text x="28" y="32" font-size="10" text-anchor="middle" fill="#aaa">no img</text></svg>`
  );

  function toast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2200);
  }

  function isOutOfStock(item) {
    return item.inStock === false;
  }

  /* ==================================================================
     รายการอาหารที่ลูกค้าสั่งไปแล้ว (เฉพาะที่ "เครื่องนี้" เป็นคนสั่งเอง)
     ใช้ localStorage เก็บเลขออเดอร์ของตัวเอง เพื่อไม่ให้ปนกับออเดอร์ของ
     คนอื่นที่โต๊ะเดียวกัน หรือออเดอร์ที่พนักงานกดสั่งแทนให้
  ================================================================== */
  const STATUS_LABELS = { pending: 'รอทำ', cooking: 'กำลังทำ', served: 'เสิร์ฟแล้ว' };
  const MY_ORDERS_KEY = `qrpos_my_order_ids_table_${table}`;

  function getMyOrderIds() {
    try {
      const raw = localStorage.getItem(MY_ORDERS_KEY);
      const ids = raw ? JSON.parse(raw) : [];
      return Array.isArray(ids) ? ids : [];
    } catch (err) {
      return [];
    }
  }

  function addMyOrderId(id) {
    try {
      const ids = getMyOrderIds();
      ids.push(id);
      localStorage.setItem(MY_ORDERS_KEY, JSON.stringify(ids));
    } catch (err) {
      // ถ้า localStorage ใช้ไม่ได้ (เช่น โหมดส่วนตัว) ก็แค่จะไม่เห็นประวัติเก่า ไม่กระทบการสั่งอาหาร
    }
  }

  async function loadMyOrders() {
    const myIds = getMyOrderIds();
    if (myIds.length === 0) {
      document.getElementById('myOrdersSection').style.display = 'none';
      return;
    }

    let orders;
    try {
      orders = await fetch('/api/orders').then(r => r.json());
    } catch (err) {
      return; // เงียบไว้ ไม่ต้องรบกวนลูกค้าถ้าโหลดไม่สำเร็จชั่วคราว
    }

    const myOrders = orders
      .filter(o => myIds.includes(o.id))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    const section = document.getElementById('myOrdersSection');
    const list = document.getElementById('myOrdersList');

    if (myOrders.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    list.innerHTML = '';

    myOrders.forEach((o, idx) => {
      const total = o.items.reduce((sum, it) => sum + it.price * it.qty, 0);
      const itemsText = o.items.map(it => `${it.name} x${it.qty}`).join(', ');
      const time = new Date(o.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      const statusLabel = STATUS_LABELS[o.status] || o.status;

      const card = document.createElement('div');
      card.className = `my-order-card status-${o.status}`;
      card.innerHTML = `
        <div class="my-order-top">
          <span class="my-order-time">รอบที่ ${idx + 1} • ${time} น.</span>
          <span class="status-pill status-${o.status}">${statusLabel}</span>
        </div>
        <div class="my-order-items">${itemsText}</div>
        <div class="my-order-total">${total} บาท</div>
      `;
      list.appendChild(card);
    });
  }

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const item = menu.find(m => m.id === Number(id));
      if (!item) continue;
      total += item.price * cart[id];
    }
    document.getElementById('cartTotal').textContent = total;
  }

  function changeQty(id, delta) {
    const item = menu.find(m => m.id === id);
    if (item && isOutOfStock(item)) {
      toast(`"${item.name}" สินค้าหมด ไม่สามารถสั่งได้`, true);
      return;
    }
    cart[id] = Math.max(0, (cart[id] || 0) + delta);
    document.getElementById(`qty-${id}`).textContent = cart[id];
    updateTotal();
  }

  async function loadMenu() {
    menu = await fetch('/api/menu').then(r => r.json());
    const categories = [...new Set(menu.map(m => m.category))];
    const container = document.getElementById('menuList');
    container.innerHTML = '';

    for (const cat of categories) {
      const catEl = document.createElement('div');
      catEl.className = 'category';
      catEl.textContent = cat;
      container.appendChild(catEl);

      menu.filter(m => m.category === cat).forEach(item => {
        const outOfStock = isOutOfStock(item);
        const el = document.createElement('div');
        el.className = 'item' + (outOfStock ? ' out-of-stock' : '');
        const imgSrc = item.image || FALLBACK_IMG;
        el.innerHTML = `
          <div class="item-left">
            <img class="item-img" src="${imgSrc}" alt="${item.name}"
                 onerror="this.onerror=null;this.src='${FALLBACK_IMG}';" />
            <div class="item-info">
              <h3>${item.name}</h3>
              <span>${item.price} บาท</span>
              ${outOfStock ? '<div class="out-of-stock-badge">สินค้าหมด</div>' : ''}
            </div>
          </div>
          <div class="qty-control">
            <button data-id="${item.id}" data-delta="-1"${outOfStock ? ' disabled' : ''}>-</button>
            <span id="qty-${item.id}">0</span>
            <button data-id="${item.id}" data-delta="1"${outOfStock ? ' disabled' : ''}>+</button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    container.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        changeQty(Number(btn.dataset.id), Number(btn.dataset.delta));
      });
    });

    document.getElementById('submitBtn').onclick = async () => {
      const items = Object.entries(cart)
        .filter(([, qty]) => qty > 0)
        .map(([menuId, qty]) => ({ menuId: Number(menuId), qty }));

      if (items.length === 0) {
        toast('กรุณาเลือกเมนูก่อน', true);
        return;
      }

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ table, items }),
        });
        const data = await res.json();

        if (res.ok) {
          toast('สั่งอาหารสำเร็จ! รอครัวเตรียมอาหารนะครับ');
          addMyOrderId(data.id); // จำไว้ว่าออเดอร์นี้เป็นของเครื่องนี้ ไม่ปนกับคนอื่นที่โต๊ะเดียวกัน
          cart = {};
          menu.forEach(m => {
            const qEl = document.getElementById(`qty-${m.id}`);
            if (qEl) qEl.textContent = '0';
          });
          updateTotal();
          loadMyOrders(); // แสดงรายการที่เพิ่งสั่งให้ลูกค้าเห็นทันที
          document.getElementById('myOrdersSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          // เช่น กรณีสินค้าหมดพอดีตอนกดสั่ง (คนอื่นสั่งตัดหน้า หรือร้านเพิ่งอัปเดตสถานะ)
          toast(data.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่', true);
          await loadMenu(); // โหลดเมนูใหม่เพื่ออัปเดตสถานะสินค้าหมดล่าสุด
        }
      } catch (err) {
        toast('เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่', true);
      }
    };
  }

  loadMenu();
  loadMyOrders();
  setInterval(loadMyOrders, 5000); // รีเฟรชสถานะอาหารที่สั่งไปแล้วอัตโนมัติทุก 5 วินาที (รอทำ/กำลังทำ/เสิร์ฟแล้ว)
</script>
</body>
</html>
