<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>QR POS - หน้าพนักงาน (สั่งอาหารแทนลูกค้า)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background:#f4f6f8; margin:0; padding:0; }
  nav { padding:16px 24px 0; }
  nav a { margin-right:16px; color:#0984e3; text-decoration:none; font-weight:600; }
  h1 { color:#2d3436; padding:0 24px; margin:12px 0; font-size:22px; }

  .layout { display:flex; gap:16px; padding:0 24px 24px; align-items:flex-start; }
  .menu-panel { flex:2; min-width:0; }
  .cart-panel {
    flex:1; min-width:280px; background:#fff; border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08); padding:16px; position:sticky; top:16px;
  }

  .table-select {
    background:#fff; border-radius:10px; padding:14px 16px; margin:0 24px 16px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08); display:flex; align-items:center; gap:12px;
  }
  .table-select label { font-weight:600; color:#2d3436; }
  .table-select select {
    padding:8px 12px; border-radius:6px; border:1px solid #ccc; font-size:15px;
  }

  .search-box {
    width:100%; padding:10px 14px; border-radius:8px; border:1px solid #ccc;
    font-size:15px; margin-bottom:12px;
  }

  .category-block { margin-bottom:18px; }
  .category-title {
    font-weight:700; color:#d63031; margin-bottom:8px; font-size:15px;
    border-bottom:2px solid #d63031; padding-bottom:4px; display:inline-block;
  }

  .item-row {
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border-radius:8px; padding:10px 14px; margin-bottom:8px;
    box-shadow:0 1px 4px rgba(0,0,0,0.06); cursor:pointer; user-select:none;
    transition:background 0.15s;
  }
  .item-row:hover { background:#eef7ff; }
  .item-name { font-size:14px; color:#2d3436; }
  .item-price { font-size:13px; color:#0984e3; font-weight:600; white-space:nowrap; margin-left:8px; }

  .cart-title { font-size:17px; font-weight:700; color:#2d3436; margin-bottom:10px; }
  .cart-empty { color:#999; font-size:14px; padding:12px 0; }
  .cart-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:14px;
  }
  .cart-item .name { flex:1; color:#2d3436; }
  .qty-controls { display:flex; align-items:center; gap:6px; margin:0 8px; }
  .qty-controls button {
    width:24px; height:24px; border:none; border-radius:5px; background:#dfe6e9;
    font-size:15px; cursor:pointer; line-height:1;
  }
  .qty-controls span { min-width:18px; text-align:center; font-weight:600; }
  .remove-btn { color:#d63031; background:none; border:none; cursor:pointer; font-size:13px; }

  .cart-total {
    display:flex; justify-content:space-between; font-weight:700; font-size:16px;
    color:#2d3436; margin:12px 0;
  }
  .submit-btn {
    width:100%; padding:12px; border:none; border-radius:8px; background:#00b894;
    color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  .submit-btn:disabled { background:#b2bec3; cursor:not-allowed; }
  .submit-btn:hover:not(:disabled) { background:#00a884; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#2d3436; color:#fff; padding:12px 20px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <nav>
    <a href="/index.html">ตั้งค่าโต๊ะ (QR)</a>
    <a href="/kitchen.html">หน้าครัว / ดูออเดอร์</a>
    <a href="/staff-order.html">สั่งอาหารแทนลูกค้า (พนักงาน)</a>
  </nav>
  <h1>สั่งอาหารแทนลูกค้า</h1>

  <div class="table-select">
    <label for="tableSelect">โต๊ะที่ :</label>
    <select id="tableSelect"></select>
  </div>

  <div class="layout">
    <div class="menu-panel">
      <input type="text" class="search-box" id="searchBox" placeholder="ค้นหาเมนู..." />
      <div id="menuContainer"></div>
    </div>

    <div class="cart-panel">
      <div class="cart-title">รายการที่เลือก</div>
      <div id="cartList"><div class="cart-empty">ยังไม่ได้เลือกเมนู</div></div>
      <div class="cart-total">
        <span>รวมทั้งหมด</span>
        <span id="cartTotal">0 บาท</span>
      </div>
      <button class="submit-btn" id="submitBtn" disabled>ยืนยันสั่งอาหาร</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const TABLE_COUNT = 10;
  let menu = [];
  let cart = {}; // menuId -> { item, qty }

  const tableSelect = document.getElementById('tableSelect');
  const menuContainer = document.getElementById('menuContainer');
  const cartList = document.getElementById('cartList');
  const cartTotal = document.getElementById('cartTotal');
  const submitBtn = document.getElementById('submitBtn');
  const searchBox = document.getElementById('searchBox');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function initTableSelect() {
    for (let i = 1; i <= TABLE_COUNT; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `โต๊ะ ${i}`;
      tableSelect.appendChild(opt);
    }
  }

  async function loadMenu() {
    menu = await fetch('/api/menu').then(r => r.json());
    renderMenu(menu);
  }

  function renderMenu(items) {
    const categories = {};
    for (const it of items) {
      if (!categories[it.category]) categories[it.category] = [];
      categories[it.category].push(it);
    }

    menuContainer.innerHTML = '';
    for (const cat in categories) {
      const block = document.createElement('div');
      block.className = 'category-block';
      block.innerHTML = `<div class="category-title">${cat}</div>`;

      for (const item of categories[cat]) {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span class="item-name">${item.name}</span>
          <span class="item-price">${item.price} บาท</span>
        `;
        row.addEventListener('click', () => addToCart(item));
        block.appendChild(row);
      }
      menuContainer.appendChild(block);
    }
  }

  function addToCart(item) {
    if (!cart[item.id]) {
      cart[item.id] = { item, qty: 0 };
    }
    cart[item.id].qty += 1;
    renderCart();
  }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderCart();
  }

  function removeItem(id) {
    delete cart[id];
    renderCart();
  }

  function renderCart() {
    const ids = Object.keys(cart);
    if (ids.length === 0) {
      cartList.innerHTML = '<div class="cart-empty">ยังไม่ได้เลือกเมนู</div>';
      submitBtn.disabled = true;
      cartTotal.textContent = '0 บาท';
      return;
    }

    let total = 0;
    cartList.innerHTML = '';
    for (const id of ids) {
      const { item, qty } = cart[id];
      total += item.price * qty;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <span class="name">${item.name}</span>
        <div class="qty-controls">
          <button onclick="changeQty(${id}, -1)">-</button>
          <span>${qty}</span>
          <button onclick="changeQty(${id}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem(${id})">ลบ</button>
      `;
      cartList.appendChild(row);
    }
    cartTotal.textContent = `${total} บาท`;
    submitBtn.disabled = false;
  }

  async function submitOrder() {
    const table = Number(tableSelect.value);
    const items = Object.values(cart).map(({ item, qty }) => ({
      menuId: item.id,
      qty,
    }));

    if (items.length === 0) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังส่งออเดอร์...';

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table, items }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');

      showToast(`สั่งอาหารโต๊ะ ${table} สำเร็จ`);
      cart = {};
      renderCart();
    } catch (err) {
      showToast('ผิดพลาด: ' + err.message);
    } finally {
      submitBtn.textContent = 'ยืนยันสั่งอาหาร';
      submitBtn.disabled = Object.keys(cart).length === 0;
    }
  }

  searchBox.addEventListener('input', () => {
    const q = searchBox.value.trim().toLowerCase();
    const filtered = menu.filter(m => m.name.toLowerCase().includes(q));
    renderMenu(filtered);
  });

  submitBtn.addEventListener('click', submitOrder);

  initTableSelect();
  loadMenu();
</script>
</body>
</html>
